# Host nginx site for Papyrus.
#   sudo cp deploy/nginx/papyrus.conf /etc/nginx/sites-available/papyrus
#   sudo ln -s /etc/nginx/sites-available/papyrus /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ports must match UI_PORT / API_PORT in .env.prod.

server {
    listen 80;
    server_name papyrus.example.com;  # your domain

    # API: /api/songs/... -> http://127.0.0.1:8000/songs/...
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # UI
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
